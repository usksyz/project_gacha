# Exporte le jeu en version web et le publie sur GitHub Pages à chaque push sur main.
name: Publier la version web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot et les modèles d'export
        working-directory: ${{ runner.temp }}
        run: |
          BASE_URL=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # Réécrit scripts/build_info.gd : « 15012ab du 28/09/2026 à 14:03 » (heure de Paris).
      - name: Inscrire le numéro de version
        run: |
          VERSION="$(git rev-parse --short HEAD) du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M')"
          sed -i "s|^const VERSION := .*|const VERSION := \"$VERSION\"|" scripts/build_info.gd
          grep "const VERSION" scripts/build_info.gd

      - name: Exporter le jeu
        run: |
          mkdir -p build/web
          ${{ runner.temp }}/godot --headless --import || true
          ${{ runner.temp }}/godot --headless --export-release "Web" build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
